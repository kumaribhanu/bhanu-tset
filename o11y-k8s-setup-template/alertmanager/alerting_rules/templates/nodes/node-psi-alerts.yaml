spec:
  groups:
  - interval: 30s
    name: node-psi-alerts
    rules:
    - alert: NodeCPUPressureHigh
      annotations:
        dashboard_url: https://grafana.opstree.net/explore
        description: |
          Node {{ $labels.instance }} in DC {{ $labels.dc }} is experiencing high CPU pressure.
          Processes are waiting for CPU resources.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md
        summary: High CPU Pressure on node {{ $labels.instance }} ({{ $labels.dc }})
      expr: |
        rate(node_pressure_cpu_waiting_seconds_total[5m]) > 0.2
      for: 5m
      labels:
        alert: kubernetes
        channel: slack
        severity: warning
        team: devops
    - alert: NodeMemoryPressureHigh
      annotations:
        dashboard_url: https://grafana.opstree.net/explore
        description: |
          Node {{ $labels.instance }} in DC {{ $labels.dc }} is under high memory pressure.
          Processes are waiting due to memory contention.
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md
        summary: High Memory Pressure on node {{ $labels.instance }} ({{ $labels.dc
          }})
      expr: |
        rate(node_pressure_memory_waiting_seconds_total[5m]) > 0.1
      for: 5m
      labels:
        alert: kubernetes
        channel: slack
        severity: critical
        team: devops
    - alert: NodeDiskPressureHigh
      annotations:
        dashboard_url: https://grafana.opstree.net/explore
        description: |
          Node Disk I/O Pressure High

          Instance  : {{ $labels.instance }}
          Node Name : {{ $labels.nodename }}
          DC        : {{ $labels.dc }}
          VALUE     : {{ $value | printf "%.4f" }}
          Threshold : 0.1
        runbook_url: https://github.com/kubernetes-monitoring/kubernetes-mixin/tree/master/runbook.md
        summary: 'High Disk Pressure on {{ $labels.nodename }} ({{ $labels.instance
          }}) | DC: {{ $labels.dc }}'
      expr: |
        rate(node_pressure_io_waiting_seconds_total[5m]) > 0.1
      for: 5m
      labels:
        alert: kubernetes
        channel: ldc-infra-alerts
        severity: warning
        team: devops
